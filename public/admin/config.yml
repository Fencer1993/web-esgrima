# Panel de edición del Club de Esgrima Torremolinos (Sveltia CMS).
# Cada sección corresponde a un archivo de src/content/data/.
backend:
  name: github
  repo: Fencer1993/web-esgrima
  branch: claude/esgrima-web-rebuild-1or7ev
  # Inicio de sesión con GitHub a través del propio hosting (PHP en OVH).
  base_url: https://www.esgrimatorremolinos.com
  auth_endpoint: admin-auth/auth.php
  commit_messages:
    update: "Panel: actualiza {{collection}} «{{slug}}»"

locale: es
site_url: https://www.esgrimatorremolinos.com
display_url: https://www.esgrimatorremolinos.com

media_folder: public/images/galeria
public_folder: /images/galeria

# Las fotos subidas se convierten a WebP y se reducen antes de guardarse.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 1600

collections:
  - name: contenido
    label: Contenido de la web
    format: json
    files:
      - name: horarios
        label: Horarios
        file: src/content/data/horarios.json
        fields:
          - { name: technificationNote, label: "Nota de acceso a tecnificación (letra pequeña)", widget: string }
          - name: competitionGroups
            label: Grupos de tecnificación (lunes)
            widget: list
            summary: "{{name}} · {{hours}}"
            fields:
              - { name: name, label: Nombre del grupo, widget: string }
              - { name: days, label: Días, widget: string }
              - { name: hours, label: Horario, widget: string, hint: "Ejemplo: 18:00 – 20:00" }
              - { name: text, label: Descripción, widget: text }
          - name: groups
            label: Grupos regulares
            widget: list
            summary: "{{group}} · {{hours}}"
            fields:
              - { name: group, label: Grupo, widget: string }
              - { name: days, label: Días, widget: string, hint: "Ejemplo: Martes, miércoles y jueves" }
              - { name: hours, label: Horario, widget: string }
              - { name: note, label: "Nota en letra pequeña (opcional)", widget: string, required: false }
          - name: physicalTraining
            label: Entrenamiento físico
            widget: object
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: price, label: Precio, widget: string }
              - { name: days, label: Días, widget: string }
              - { name: hours, label: Horario, widget: string }
              - { name: text, label: Descripción, widget: text }

      - name: precios
        label: Precios
        file: src/content/data/precios.json
        fields:
          - name: plans
            label: Cuotas
            widget: list
            summary: "{{name}} · {{price}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: price, label: Precio, widget: string, hint: "Ejemplo: 30€" }
              - { name: period, label: Periodo, widget: string, hint: "al mes, por clase…" }
              - { name: features, label: Incluye, widget: list, field: { name: item, label: Elemento, widget: string } }
          - name: bonos
            label: Bonos
            widget: list
            summary: "{{name}} · {{price}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: price, label: Precio adultos, widget: string }
              - { name: childPrice, label: Precio niños, widget: string }
              - { name: note, label: Ahorro, widget: string }
          - name: federationFees
            label: Licencias federativas
            widget: list
            summary: "{{label}} · {{price}}"
            fields:
              - { name: label, label: Licencia, widget: string }
              - { name: price, label: Precio, widget: string }

      - name: equipo
        label: Equipo y deportistas
        file: src/content/data/equipo.json
        fields:
          - name: coaches
            label: Entrenadores
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: role, label: Cargo, widget: string }
              - { name: bio, label: Currículum, widget: text }
              - { name: phone, label: Teléfono, widget: string }
              - { name: email, label: Correo, widget: string }
              - { name: photo, label: Foto, widget: image, media_folder: /public/images/equipo, public_folder: /images/equipo }
              - { name: photoAlt, label: "Descripción de la foto (para buscadores y lectores de pantalla)", widget: string }
          - name: athletes
            label: Deportistas
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: achievement, label: "Palmarés o frase corta", widget: text, required: false }
              - { name: photo, label: "Foto (opcional)", widget: image, required: false, media_folder: /public/images/deportistas, public_folder: /images/deportistas }
              - { name: slug, label: "Dirección de su página (opcional)", widget: string, required: false, hint: "sin espacios ni tildes, ej. keila. Si lo dejas vacío se usa el nombre. Solo tienen página propia quienes tengan resultados o una biografía." }
              - { name: bio, label: "Biografía (opcional)", widget: text, required: false, hint: "Solo nombre de pila y datos que la familia haya autorizado publicar (muchos son menores). Separa los párrafos con una línea en blanco." }
              - { name: weapon, label: "Arma (opcional)", widget: string, required: false, hint: "ej. Sable" }
              - { name: since, label: "En el club desde (año, opcional)", widget: number, required: false, value_type: int, min: 1990, max: 2100 }

      - name: galeria
        label: Galería de fotos
        file: src/content/data/galeria.json
        fields:
          - name: items
            label: Fotos (las primeras salen en la cinta de la portada)
            widget: list
            summary: "{{category}} · {{caption}}"
            fields:
              - { name: src, label: Foto, widget: image }
              - { name: category, label: Lugar, widget: select, options: ["En nuestra sala", "Competiciones"] }
              - { name: caption, label: Pie de foto, widget: string }
              - { name: alt, label: "Qué se ve en la foto (para buscadores)", widget: string, required: false }

      - name: faq
        label: Preguntas frecuentes
        file: src/content/data/faq.json
        fields:
          - name: items
            label: Preguntas
            widget: list
            summary: "{{question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text }

      - name: programas
        label: Clases y valores
        file: src/content/data/programas.json
        fields:
          - name: programs
            label: Clases
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{title}}"
            fields:
              - { name: slug, label: Página, widget: hidden }
              - { name: title, label: Título, widget: string }
              - { name: tagline, label: Frase corta, widget: text }
              - { name: ageRange, label: Edades, widget: string }
              - { name: schedule, label: Horario (texto), widget: string }
              - { name: photo, label: "Foto (nombre del archivo en la galería, sin extensión)", widget: string }
          - name: values
            label: Valores
            widget: list
            allow_add: false
            allow_remove: false
            summary: "{{title}}"
            fields:
              - { name: icon, label: Icono, widget: hidden }
              - { name: title, label: Título, widget: string }
              - { name: body, label: Texto, widget: text }

      - name: club
        label: Datos del club y contacto
        file: src/content/data/club.json
        fields:
          - { name: name, label: Nombre, widget: string }
          - { name: shortName, label: Nombre corto, widget: string }
          - { name: domain, label: Dominio, widget: hidden }
          - { name: url, label: Web, widget: hidden }
          - { name: description, label: "Descripción (Google y redes)", widget: text }
          - name: address
            label: Dirección
            widget: object
            fields:
              - { name: line, label: Calle, widget: string }
              - { name: postalCode, label: Código postal, widget: string }
              - { name: city, label: Localidad, widget: string }
              - { name: region, label: Provincia, widget: string }
              - { name: country, label: País, widget: hidden }
              - { name: venue, label: Instalación, widget: string }
              - { name: mapsUrl, label: Enlace de Google Maps, widget: string }
          - name: contact
            label: Contacto
            widget: object
            fields:
              - { name: phone, label: "Teléfono (como se muestra)", widget: string }
              - { name: phoneDial, label: "Teléfono para llamar (+34…)", widget: string }
              - { name: whatsapp, label: "WhatsApp (34 + número, sin espacios)", widget: string }
              - { name: email, label: Correo, widget: string }
          - name: social
            label: Redes
            widget: object
            fields:
              - { name: instagram, label: Instagram, widget: string }
          - name: legal
            label: Datos legales
            widget: object
            fields:
              - { name: entityName, label: Denominación, widget: string }
              - { name: cif, label: CIF, widget: string }
              - { name: legalForm, label: Forma jurídica, widget: string }
              - { name: representative, label: Representante, widget: string }
              - { name: representativeDni, label: DNI del representante, widget: string }
              - { name: representativeRole, label: Cargo, widget: string }
              - { name: registry, label: "N.º Registro Andaluz de Entidades Deportivas", widget: string, required: false }

      - name: textos
        label: Textos de las páginas
        file: src/content/data/textos.json
        fields:
          - name: paginas
            label: Cabecera de cada página
            widget: list
            summary: "{{title}}"
            allow_add: false
            allow_remove: false
            fields:
              - { name: path, label: Ruta, widget: hidden }
              - { name: eyebrow, label: Etiqueta superior, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: lede, label: Entradilla, widget: text }
          - name: inicio
            label: Página de inicio
            widget: object
            fields:
              - { name: heroEyebrow, label: "Portada: etiqueta superior", widget: string }
              - { name: heroLede, label: "Portada: texto bajo el título", widget: text }
              - { name: heroCta, label: "Portada: botón principal", widget: string }
              - { name: heroSecondaryCta, label: "Portada: botón secundario", widget: string }
              - { name: finalTitle, label: "Cierre: título", widget: string }
              - { name: finalText, label: "Cierre: texto", widget: text }
              - { name: finalCta, label: "Cierre: botón", widget: string }

      - name: faq-silla
        label: "Preguntas: silla de ruedas"
        file: src/content/data/faq-silla.json
        fields:
          - name: items
            label: Preguntas
            widget: list
            summary: "{{question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text }

      - name: clase-gratis
        label: Pasos de la primera clase
        file: src/content/data/clase-gratis.json
        fields:
          - name: steps
            label: Pasos
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Título, widget: string }
              - { name: text, label: Texto, widget: text }
              - { name: photo, label: Foto, widget: string, hint: "fragmento del nombre de una foto de la galería" }

      - name: cifras
        label: Cifras de la portada
        file: src/content/data/cifras.json
        fields:
          - name: stats
            label: Cifras
            widget: list
            summary: "{{value}} {{label}}"
            fields:
              - { name: value, label: Número, widget: number, value_type: int }
              - { name: label, label: Etiqueta, widget: string }
              - { name: detail, label: Detalle, widget: string }

      - name: cabeceras
        label: Fotos de cabecera
        file: src/content/data/cabeceras.json
        fields:
          - name: items
            label: Foto de cabecera de cada página
            widget: list
            summary: "{{path}}"
            allow_add: false
            allow_remove: false
            fields:
              - { name: path, label: Ruta, widget: hidden }
              - { name: photo, label: Foto, widget: string, hint: "fragmento del nombre de una foto de la galería" }
              - { name: position, label: Encuadre, widget: string, required: false, hint: "object-[center_30%] = encuadre vertical; no tocar si no sabes" }

      - name: reservas
        label: Reserva de clase gratis
        file: src/content/data/reservas.json
        fields:
          - { name: weeksAhead, label: Semanas hacia delante que se puede reservar, widget: number, value_type: int, min: 1, max: 12, default: 4 }
          - { name: minNoticeHours, label: Horas mínimas de antelación, widget: number, value_type: int, min: 0, max: 168, default: 12, hint: "Una clase que empieza antes de estas horas ya no se puede reservar" }
          - name: notes
            label: Qué traer (avisos que ve la persona)
            widget: list
            field: { name: text, label: Aviso, widget: string }
          - name: blockedDates
            label: Días sin clase (festivos, vacaciones)
            widget: list
            summary: "{{date}} · {{reason}}"
            fields:
              - { name: date, label: "Fecha (AAAA-MM-DD)", widget: string, hint: "Por ejemplo 2026-12-25" }
              - { name: reason, label: Motivo, widget: string }
          - name: groups
            label: Grupos con clase gratis
            widget: list
            summary: "{{name}}"
            fields:
              - { name: id, label: Identificador (no cambiar), widget: string, hint: "Sin espacios ni tildes; se guarda en las reservas" }
              - { name: name, label: Nombre del grupo, widget: string, hint: "Igual que en Horarios y precios" }
              - name: weekdays
                label: Días de la semana
                widget: select
                multiple: true
                value_type: int
                options:
                  - { label: Lunes, value: 1 }
                  - { label: Martes, value: 2 }
                  - { label: Miércoles, value: 3 }
                  - { label: Jueves, value: 4 }
                  - { label: Viernes, value: 5 }
                  - { label: Sábado, value: 6 }
                  - { label: Domingo, value: 7 }
              - { name: start, label: "Hora de inicio (HH:MM)", widget: string }
              - { name: end, label: "Hora de fin (HH:MM)", widget: string }
              - { name: capacity, label: "Plazas de clase gratis por sesión (0 = sin límite)", widget: number, value_type: int, min: 0, max: 50, default: 0 }
              - { name: minAge, label: Edad (texto que se muestra), widget: string }
              - { name: minAgeYears, label: Edad mínima en años (0 = sin límite), widget: number, value_type: int, min: 0, max: 99, default: 0 }
              - { name: maxAgeYears, label: Edad máxima en años, widget: number, value_type: int, min: 1, max: 99, required: false }
              - { name: ageRequired, label: Pedir la edad obligatoriamente, widget: boolean, default: false }

      - name: tienda
        label: Tienda del club
        file: src/content/data/tienda.json
        fields:
          - { name: intro, label: Texto de introducción, widget: text }
          - { name: orderEmail, label: Correo que recibe los pedidos, widget: string }
          - name: products
            label: Productos
            widget: list
            summary: "{{name}} · {{supplier}} · {{price}}"
            fields:
              - { name: id, label: "Identificador (sin espacios, ej. careta-sable)", widget: string }
              - { name: name, label: Nombre, widget: string }
              - { name: name_en, label: "Nombre en inglés (opcional; si se deja vacío se usa el nombre)", widget: string, required: false }
              - { name: supplier, label: "Proveedor (Grant Esgrima, Allstar, Yiang…)", widget: string }
              - { name: ref, label: "Referencia del proveedor", widget: string, required: false }
              - { name: url, label: "Enlace a la ficha del proveedor", widget: string, required: false, hint: "https://… (fotos y tabla de tallas oficiales)" }
              - { name: sizeGuide, label: "Enlace a la tabla de tallas", widget: string, required: false }
              - { name: category, label: Categoría, widget: select, options: ["Sables y hojas", "Caretas", "Chaquetas eléctricas", "Guantes y manguitos", "Trajes", "Protección", "Calzado y medias", "Piezas y recambios", "Pasantes y conectores", "Kits de iniciación", "Iniciación (plástico y espuma)", "Material de maestro", "Silla de ruedas"] }
              - { name: description, label: Descripción, widget: text, required: false, hint: "Tu explicación para los socios (si se deja vacía, no se muestra)." }
              - { name: description_en, label: "Descripción en inglés (opcional; si se deja vacía se muestra la española)", widget: text, required: false }
              - { name: price, label: "Precio orientativo (ej. 45,00 €)", widget: string, required: false }
              - { name: sizes, label: Tallas, widget: list, required: false, field: { name: talla, label: Talla, widget: string } }
              - { name: hands, label: "Mano (Diestro/Zurdo) — vacío si no aplica", widget: list, required: false, field: { name: mano, label: Mano, widget: string } }
              - name: options
                label: "Otras opciones (color, cazoleta, puño…)"
                widget: list
                required: false
                summary: "{{name}}"
                fields:
                  - { name: name, label: Opción, widget: string }
                  - { name: values, label: Valores, widget: list, field: { name: valor, label: Valor, widget: string } }
              - { name: photo, label: Foto, widget: image, required: false, media_folder: /public/images/tienda, public_folder: /images/tienda }
              - { name: active, label: Visible en la tienda, widget: boolean, default: true }
              - { name: imageSource, label: "Foto original del proveedor (se descarga sola)", widget: string, required: false }
              - { name: imported, label: "Importado del catálogo del proveedor", widget: boolean, default: false, required: false }

      - name: tallas
        label: Guía de tallas (tienda)
        file: src/content/data/tallas.json
        fields:
          - { name: intro, label: Texto de introducción, widget: text }
          - name: howToMeasure
            label: Cómo tomarse las medidas
            widget: list
            summary: "{{part}}"
            fields:
              - { name: part, label: Medida, widget: string }
              - { name: how, label: Cómo medir, widget: text }
          - name: brands
            label: Marcas
            widget: list
            summary: "{{name}}"
            fields:
              - { name: id, label: "Identificador (sin espacios; las fichas enlazan a #tallas-<id>)", widget: string }
              - { name: name, label: Marca, widget: string }
              - { name: suppliers, label: Proveedor, widget: string }
              - { name: note, label: Nota, widget: text }
              - { name: source, label: Enlace a la tabla original, widget: string }
              - name: tables
                label: Tablas
                widget: list
                required: false
                summary: "{{title}}"
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: headers, label: Columnas, widget: list, field: { name: col, label: Columna, widget: string } }
                  - name: rows
                    label: "Filas (una línea por fila; valores separados por comas)"
                    widget: list
                    field: { name: fila, label: Fila, widget: list, field: { name: valor, label: Valor, widget: string } }

      - name: resultados
        label: Resultados y palmarés
        file: src/content/data/resultados.json
        fields:
          - name: tournaments
            label: Torneos
            widget: list
            summary: "{{date}} · {{name}}"
            fields:
              - { name: slug, label: "Dirección (slug)", widget: string, hint: "sin espacios ni tildes, ej. torneo-jaen-2026" }
              - { name: name, label: Nombre del torneo, widget: string }
              - { name: date, label: Fecha, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { name: city, label: Ciudad, widget: string, required: false }
              - { name: level, label: Nivel, widget: select, options: [Local, Provincial, Autonómico, Nacional, Internacional], default: Local }
              - { name: weapon, label: Arma, widget: string, default: Sable }
              - { name: category, label: Categoría, widget: string, required: false, hint: "ej. Sub-15 masculino, Absoluto femenino, Veteranos, Silla de ruedas" }
              - { name: link, label: "Enlace a los resultados oficiales (opcional)", widget: string, required: false }
              - { name: photo, label: Foto (opcional), widget: image, required: false, media_folder: /public/images/resultados, public_folder: /images/resultados }
              - { name: summary, label: "Resumen (opcional)", widget: text, required: false }
              - name: results
                label: Resultados del club
                widget: list
                required: false
                summary: "{{position}}º {{athlete}}"
                fields:
                  - { name: athlete, label: "Tirador/a (solo nombre de pila, igual que en Equipo)", widget: string }
                  - { name: position, label: Puesto, widget: number, value_type: int, min: 1 }
                  - { name: medal, label: "Medalla (se pone sola con los puestos 1, 2 y 3)", widget: select, options: [{ label: "Automática", value: "" }, { label: Oro, value: oro }, { label: Plata, value: plata }, { label: Bronce, value: bronce }], default: "", required: false }

      - name: patrocinadores
        label: Patrocinadores
        file: src/content/data/patrocinadores.json
        fields:
          - { name: intro, label: Texto de introducción, widget: text }
          - { name: emptyTitle, label: "Título si aún no hay patrocinadores", widget: string }
          - { name: emptyText, label: "Texto si aún no hay patrocinadores", widget: text }
          - name: sponsors
            label: Patrocinadores
            widget: list
            required: false
            summary: "{{tier}} · {{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: tier, label: Nivel, widget: select, options: [Principal, Colaborador, Institucional], default: Colaborador }
              - { name: logo, label: Logotipo (opcional), widget: image, required: false, media_folder: /public/images/patrocinadores, public_folder: /images/patrocinadores }
              - { name: url, label: "Web (opcional)", widget: string, required: false }
          - { name: reasonsTitle, label: "Título: por qué patrocinar", widget: string }
          - name: reasons
            label: Motivos para patrocinar
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Título, widget: string }
              - { name: text, label: Texto, widget: text }
          - { name: memoriaTitle, label: "Título: el club en cifras", widget: string }
          - { name: memoriaLede, label: "Entradilla: el club en cifras (las cifras se editan en «Cifras de la portada»)", widget: text }
          - { name: ctaTitle, label: "Llamada a la acción: título", widget: string }
          - { name: ctaText, label: "Llamada a la acción: texto", widget: text }
          - { name: ctaMessage, label: "Mensaje de WhatsApp ya escrito", widget: text }

      - name: noticias
        label: Tablón de anuncios
        file: src/content/data/noticias.json
        fields:
          - name: items
            label: Publicaciones
            widget: list
            summary: "{{date}} · {{title}}"
            fields:
              - { name: slug, label: "Dirección (slug)", widget: string, hint: "sin espacios, ej. torneo-jaen-2026" }
              - { name: date, label: Fecha, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { name: type, label: Tipo, widget: select, options: [Noticia, Aviso, Convocatoria, Resultado], default: Noticia }
              - { name: title, label: Título, widget: string }
              - { name: summary, label: Resumen, widget: text }
              - { name: body, label: Texto, widget: text, hint: "Separa los párrafos con una línea en blanco." }
              - { name: title_en, label: "Título en inglés (opcional)", widget: string, required: false, hint: "Para que salga en /en/news hacen falta título, resumen y texto en inglés; si falta alguno se muestra el español." }
              - { name: summary_en, label: "Resumen en inglés (opcional)", widget: text, required: false }
              - { name: body_en, label: "Texto en inglés (opcional)", widget: text, required: false, hint: "Separa los párrafos con una línea en blanco." }
              - { name: image, label: Foto, widget: image, required: false, media_folder: /public/images/noticias, public_folder: /images/noticias }
              - { name: pinned, label: "Destacada (fijada arriba)", widget: boolean, default: false }

  # Versión en inglés (/en/). Solo prosa traducida: horas, precios, nombres y
  # fotos se leen de los datos en español. Cada lista va alineada, por
  # posición, con la lista española equivalente; {1}, {2}… se sustituyen por
  # el 1.º, 2.º… número (precio, hora, edad) del texto español.
  - name: ingles
    label: "Versión en inglés"
    format: json
    files:
      - name: en-textos
        label: "Versión en inglés · Cabeceras y portada"
        file: src/content/data/en/textos.json
        fields:
          - name: paginas
            label: Páginas interiores
            widget: list
            summary: "{{path}} · {{title}}"
            fields:
              - { name: path, label: "Ruta (no cambiar)", widget: string }
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: lede, label: Entradilla, widget: text }
          - name: inicio
            label: Portada
            widget: object
            fields:
              - { name: heroEyebrow, label: Etiqueta, widget: string }
              - { name: heroLede, label: Entradilla, widget: text }
              - { name: heroCta, label: Botón principal, widget: string }
              - { name: heroSecondaryCta, label: Botón secundario, widget: string }
              - { name: finalTitle, label: Título final, widget: string }
              - { name: finalText, label: Texto final, widget: text }
              - { name: finalCta, label: Botón final, widget: string }

      - name: en-programas
        label: "Versión en inglés · Programas y valores"
        file: src/content/data/en/programas.json
        fields:
          - name: programs
            label: "Programas (mismo slug que en español)"
            widget: list
            summary: "{{title}}"
            fields:
              - { name: slug, label: "Slug (no cambiar)", widget: string }
              - { name: title, label: Título, widget: string }
              - { name: tagline, label: Frase, widget: text }
          - name: values
            label: "Valores (mismo orden que en español)"
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Título, widget: string }
              - { name: body, label: Texto, widget: text }

      - name: en-horarios
        label: "Versión en inglés · Horarios"
        file: src/content/data/en/horarios.json
        fields:
          - { name: technificationNote, label: "Nota de acceso a tecnificación", widget: string }
          - name: competitionGroups
            label: "Grupos de tecnificación (mismo orden que en español)"
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: text, label: Descripción, widget: text }
          - name: groups
            label: "Grupos regulares (mismo orden que en español)"
            widget: list
            summary: "{{group}}"
            fields:
              - { name: group, label: Grupo, widget: string }
              - { name: note, label: "Nota (opcional)", widget: string, required: false }
          - name: physicalTraining
            label: Entrenamiento físico
            widget: object
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: text, label: Descripción, widget: text }

      - name: en-precios
        label: "Versión en inglés · Precios"
        file: src/content/data/en/precios.json
        fields:
          - name: plans
            label: "Cuotas (mismo orden que en español)"
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: period, label: Periodo, widget: string }
              - { name: features, label: "Incluye (mismo orden; {1}, {2}… = números del texto español)", widget: list, field: { name: item, label: Elemento, widget: string } }
          - name: bonos
            label: "Bonos (mismo orden que en español)"
            widget: list
            summary: "{{name}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - { name: childLabel, label: "Texto tras el precio infantil", widget: string }
              - { name: note, label: Ahorro, widget: string }
          - name: federationFees
            label: "Licencias (mismo orden que en español)"
            widget: list
            summary: "{{label}}"
            fields:
              - { name: label, label: Licencia, widget: string }

      - name: en-equipo
        label: "Versión en inglés · Entrenadores"
        file: src/content/data/en/equipo.json
        fields:
          - name: coaches
            label: "Entrenadores (mismo orden que en español)"
            widget: list
            summary: "{{role}}"
            fields:
              - { name: role, label: Cargo, widget: string }
              - { name: bio, label: Currículum, widget: text }
              - { name: photoAlt, label: "Descripción de la foto", widget: string }

      - name: en-faq
        label: "Versión en inglés · Preguntas frecuentes"
        file: src/content/data/en/faq.json
        fields:
          - name: items
            label: "Preguntas (mismo orden que en español)"
            widget: list
            summary: "{{question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text }

      - name: en-faq-silla
        label: "Versión en inglés · Preguntas de silla de ruedas"
        file: src/content/data/en/faq-silla.json
        fields:
          - name: items
            label: "Preguntas (mismo orden que en español)"
            widget: list
            summary: "{{question}}"
            fields:
              - { name: question, label: Pregunta, widget: string }
              - { name: answer, label: Respuesta, widget: text }

      - name: en-clase-gratis
        label: "Versión en inglés · Clase gratis"
        file: src/content/data/en/clase-gratis.json
        fields:
          - name: steps
            label: "Pasos (mismo orden que en español)"
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: Título, widget: string }
              - { name: text, label: Texto, widget: text }

      - name: en-cifras
        label: "Versión en inglés · Cifras de la portada"
        file: src/content/data/en/cifras.json
        fields:
          - name: stats
            label: "Cifras (mismo orden que en español; el número se toma del español)"
            widget: list
            summary: "{{label}}"
            fields:
              - { name: label, label: Etiqueta, widget: string }
              - { name: detail, label: Detalle, widget: string }

      - name: en-tienda
        label: "Versión en inglés · Tienda y guía de tallas"
        file: src/content/data/en/tienda.json
        fields:
          - { name: intro, label: "Texto de introducción de la tienda", widget: text }
          - { name: seeCatalogue, label: "Botón «Ver el catálogo»", widget: string }
          - { name: seeSizeGuide, label: "Botón «¿No sabes tu talla?»", widget: string }
          - { name: catalogueTitle, label: "Título del catálogo", widget: string }
          - { name: emptyCatalogue, label: "Texto si no hay productos", widget: text }
          - name: sizeGuide
            label: "Guía de tallas"
            widget: object
            fields:
              - { name: eyebrow, label: Etiqueta, widget: string }
              - { name: title, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - { name: measureTitle, label: "Título «Cómo tomarte las medidas»", widget: string }
              - name: howToMeasure
                label: "Cómo medirse (mismo orden que en español)"
                widget: list
                summary: "{{part}}"
                fields:
                  - { name: part, label: Parte del cuerpo, widget: string }
                  - { name: how, label: Cómo, widget: text }
              - { name: tablesTitle, label: "Título «Tablas por marca»", widget: string }
              - { name: productsFrom, label: "«Productos de»", widget: string }
              - { name: sourceLink, label: "Enlace a la tabla del proveedor", widget: string }
              - { name: sourceLinkPdf, label: "Enlace a la tabla en PDF", widget: string }
              - { name: newTab, label: "Aviso «se abre en otra pestaña» (solo lectores de pantalla)", widget: string }
              - name: brands
                label: "Marcas: nombre y nota en inglés (id = el de la guía en español)"
                widget: list
                summary: "{{id}}"
                fields:
                  - { name: id, label: "Identificador (no cambiar)", widget: string }
                  - { name: name, label: "Nombre en inglés (vacío = el español)", widget: string, required: false }
                  - { name: note, label: Nota, widget: text }
              - name: tableTitles
                label: "Títulos de las tablas (texto español exacto → inglés)"
                widget: list
                summary: "{{es}} → {{en}}"
                fields:
                  - { name: es, label: Español, widget: string }
                  - { name: en, label: Inglés, widget: string }
              - name: headers
                label: "Cabeceras de columna (español exacto → inglés)"
                widget: list
                summary: "{{es}} → {{en}}"
                fields:
                  - { name: es, label: Español, widget: string }
                  - { name: en, label: Inglés, widget: string }
              - name: cells
                label: "Celdas con texto (español exacto → inglés)"
                widget: list
                summary: "{{es}} → {{en}}"
                fields:
                  - { name: es, label: Español, widget: string }
                  - { name: en, label: Inglés, widget: string }

      - name: en-galeria
        label: "Versión en inglés · Galería (pies y textos alternativos)"
        file: src/content/data/en/galeria.json
        fields:
          - name: items
            label: "Fotos (emparejadas por la ruta de la foto)"
            widget: list
            summary: "{{caption}}"
            fields:
              - { name: src, label: "Foto (misma ruta que en español)", widget: string }
              - { name: caption, label: Pie de foto, widget: string }
              - { name: alt, label: "Texto alternativo", widget: text }
