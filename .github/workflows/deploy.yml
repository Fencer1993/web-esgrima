name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Carpeta remota donde vive el sitio (ver guía de despliegue).
          # Ej: "./" para el raíz del hosting, o "./nuevo/" para una carpeta de staging.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          # No borra en el servidor lo que no venga del build: seguro por
          # defecto mientras convivan archivos de WordPress. Se puede pasar
          # a true más adelante, cuando el sitio estático sea lo único que
          # haya en esa carpeta.
          dangerous-clean-slate: false
