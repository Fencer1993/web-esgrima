name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Vacío = se sirve desde la raíz del dominio. Se pone a "/nuevo"
          # (Settings → Secrets and variables → Actions → Variables,
          # BASE_PATH) mientras probamos en la subcarpeta de staging.
          BASE_PATH: ${{ vars.BASE_PATH }}

      # El hosting OVH no soporta FTPS (FTP+TLS) — FileZilla lo confirma
      # al conectar. Sí expone SFTP (SSH) en el puerto 22, que es lo que
      # usamos aquí para no mandar la contraseña ni los archivos en claro.
      - name: Deploy to OVH via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./out/*
          # Ruta remota absoluta a la carpeta de staging, ej:
          # /home/esgrimb/www/nuevo (confirmar la ruta real por SFTP antes).
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftpArgs: "-o ConnectTimeout=5"

      # Diagnóstico temporal de solo lectura: para confirmar qué ha quedado
      # realmente en el servidor tras la subida. No expone credenciales
      # (GitHub enmascara los secrets en el log automáticamente). Quitar
      # este paso una vez resuelto el problema de estilos en /nuevo.
      - name: Listar carpeta remota (diagnóstico)
        run: |
          echo "--- raíz de FTP_SERVER_DIR ---"
          curl -s --insecure -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "sftp://${{ secrets.FTP_SERVER }}${{ secrets.FTP_SERVER_DIR }}/"
          echo "--- _next/static/chunks ---"
          curl -s --insecure -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "sftp://${{ secrets.FTP_SERVER }}${{ secrets.FTP_SERVER_DIR }}/_next/static/chunks/"
