name: Deploy to OVH

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Staging en la subcarpeta /nuevo. Antes se leía de una variable
          # del repositorio que no llegaba al build, y por eso /nuevo pedía
          # el CSS en /_next/ (404) y se veía sin estilos.
          BASE_PATH: /nuevo

      # El .htaccess de producción (HTTPS, www, redirecciones de WordPress)
      # no debe aplicarse dentro de /nuevo.
      - name: Quitar .htaccess en staging
        run: rm -f out/.htaccess

      # El token de Instagram nunca se guarda en el repositorio: se
      # escribe aquí, en el runner, a partir de los secrets, y solo el
      # archivo resultante (sin el token en texto en ningún commit)
      # viaja al hosting por SFTP en el siguiente paso.
      - name: Generar configuración de Instagram
        run: |
          cat > out/instagram-config.php <<PHP
          <?php
          define("INSTAGRAM_USER_ID", "${{ secrets.INSTAGRAM_USER_ID }}");
          define("INSTAGRAM_ACCESS_TOKEN", "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}");
          PHP

      # El hosting OVH no soporta FTPS (FTP+TLS) — FileZilla lo confirma
      # al conectar. Sí expone SFTP (SSH) en el puerto 22, que es lo que
      # usamos aquí para no mandar la contraseña ni los archivos en claro.
      - name: Deploy to OVH via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./out/*
          # Ruta remota absoluta a la carpeta de staging, ej:
          # /home/esgrimb/www/nuevo (confirmar la ruta real por SFTP antes).
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
          sftpArgs: "-o ConnectTimeout=5"
