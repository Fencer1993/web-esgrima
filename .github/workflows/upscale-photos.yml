name: Ampliar fotos con Real-ESRGAN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias (CPU)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet spandrel pillow numpy
          curl -sSL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - name: Fotos originales (antes del revelado anterior)
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          for f in galeria/copa-andaluza-2022-podio-m20-torremolinos galeria/podio-competicion-esgrima-torremolinos \
                   galeria/entrenamiento-previo-copa-quijote-2022 galeria/podio-torneo-semana-santa-2022 \
                   galeria/final-torneo-circuito-quijote-2022 galeria/debut-prueba-quijote-esgrima-torremolinos \
                   galeria/esgrimista-silla-de-ruedas-competicion-torremolinos \
                   equipo/carlos-soler-entrenador-esgrima-torremolinos portada/esgrima-sable-torremolinos-portada; do
            git show dec61755^:public/images/$f.webp > "$RUNNER_TEMP/in/$(basename $f).webp"
          done
          ls -la "$RUNNER_TEMP/in"
      - name: Ampliar x4
        run: python .github/scripts/upscale.py import/upscaled "$RUNNER_TEMP"/in/*.webp
      - name: Reducir a WebP sin pérdida visible (para revisar)
        run: |
          python - <<'PY'
          from PIL import Image; import pathlib
          for p in pathlib.Path("import/upscaled").glob("*.png"):
              im = Image.open(p); im.thumbnail((2400, 2400), Image.LANCZOS)
              im.save(p.with_suffix(".webp"), quality=92); p.unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add import/upscaled
          git commit -m "Real-ESRGAN upscaled photos for review" || echo nada
          git pull --rebase origin ${{ github.ref_name }} && git push
