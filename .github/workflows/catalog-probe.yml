name: Explorar catálogos de proveedores

# Temporal: inspecciona la estructura de la tienda de un proveedor para
# preparar la importación del catálogo de sable (nombres, fotos, precios).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Página a explorar"
        default: "https://www.allstar.de"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Grant (WooCommerce Store API)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B=https://grantesgrima.com/wp-json/wc/store/v1
          echo "== categorías"
          curl -sSL -A "$UA" "$B/products/categories?per_page=100" | python3 -c "
          import json,sys
          for c in json.load(sys.stdin): print(c['id'], c['parent'], c['count'], c['slug'], '|', c['name'])"
          echo "== total productos"
          curl -sSI -A "$UA" "$B/products?per_page=1" | grep -i x-wp-total
          echo "== un producto variable"
          curl -sSL -A "$UA" "$B/products?per_page=5&search=sable" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for p in d:
            p['description']=p['description'][:80]; p['short_description']=p['short_description'][:80]
          print(json.dumps(d[:2],ensure_ascii=False,indent=1)[:6000])"
      - name: Allstar (Shopware)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o cat.html "https://allstar.de/waffen/saebel/saebelklingen/"
          wc -c cat.html
          echo "== product boxes"
          grep -c 'product-box' cat.html || true
          grep -oE 'class="product-name"[^>]*href="[^"]+"|href="[^"]+"[^>]*class="product-name[^"]*"' cat.html | head -5
          python3 - <<'EOF'
          import re
          h=open('cat.html',encoding='utf-8').read()
          i=h.find('product-box')
          print(h[i-200:i+4500])
          print('== paginación', re.findall(r'[?&]p=\d+', h)[:10])
          EOF
          P=$(grep -oE 'href="https://allstar.de/[^"]+/[A-Za-z0-9-]+"' cat.html | grep -v '/waffen/' | head -1 | sed 's/href="//;s/"$//')
          echo "== producto $P"
          curl -sSL -A "$UA" -o p.html "$P"
          python3 - <<'EOF'
          import re
          h=open('p.html',encoding='utf-8').read()
          for m in re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S): print(m[:3000])
          for k in ['product-detail-configurator','product-detail-price','og:image','itemprop="price"','itemprop="sku"']:
            i=h.find(k); print('==',k); print(h[i-100:i+1500] if i>=0 else 'NO')
          EOF
