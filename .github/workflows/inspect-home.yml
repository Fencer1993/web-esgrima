name: Inspeccionar portada original

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Imágenes de la portada, en orden de aparición
        run: |
          curl -sL -A "Mozilla/5.0" https://www.esgrimatorremolinos.com/ -o home.html
          python3 - <<'PY'
          import re, urllib.request
          h = open("home.html", encoding="utf-8", errors="replace").read().replace("\\/", "/")
          rx = re.compile(r"https?://[^\s\"'()<>,]+/wp-content/uploads/[^\s\"'()<>,]+?\.(?:jpe?g|png|webp)", re.I)
          print("== og:image ==", re.findall(r'og:image" content="([^"]+)"', h))
          print("== <img> y fondos en el HTML, en orden ==")
          seen = set()
          for m in rx.finditer(h):
              u = re.sub(r"-\d+x\d+(?=\.)", "", m.group(0))
              if u in seen: continue
              seen.add(u)
              ctx = re.sub(r"\s+", " ", h[max(0, m.start()-90):m.start()])[-90:]
              print(m.start(), u.split("/uploads/")[1], "| antes:", ctx)
          for css in re.findall(r'href=["\']([^"\']*elementor/css/post-[^"\']+)["\']', h):
              try:
                  t = urllib.request.urlopen(urllib.request.Request(css, headers={"User-Agent": "Mozilla/5.0"})).read().decode("utf-8", "replace").replace("\\/", "/")
              except Exception as e:
                  print("css fail", css, e); continue
              for m in re.finditer(r"([^{}]*)\{[^{}]*background-image:\s*url\(([^)]+)\)", t):
                  print("CSS-FONDO", css.split("/")[-1], m.group(1).strip()[-70:], "->", m.group(2).split("/uploads/")[-1])
          PY
