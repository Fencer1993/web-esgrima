name: Recordatorios de clase gratis

# Cada día a las 17:07 UTC (tarde en España) pide a la web que avise por correo
# a quien tiene su clase gratis mañana. La clave se calcula igual que en
# deploy-production.yml y viaja en el cuerpo del POST, no en la URL.
on:
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorios
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then echo "Falta el secreto FTP_PASSWORD"; exit 1; fi
          KEY=$(printf '%s' "recordatorios:$FTP_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          CODE=$(curl -sS -o resp.json -w '%{http_code}' --max-time 60 \
            --data-urlencode "key=$KEY" \
            https://www.esgrimatorremolinos.com/recordatorios.php)
          echo "HTTP $CODE"
          # La respuesta solo contiene recuentos (sin datos personales).
          node -e 'try{const r=JSON.parse(require("fs").readFileSync("resp.json","utf8"));console.log(r.ok?`Clases de mañana: ${r.tomorrow}, avisos enviados: ${r.sent}, fallidos: ${r.failed}`:`Error: ${r.error}`)}catch{console.log("Respuesta no válida")}'
          [ "$CODE" = "200" ]
