name: Publicar en producción (esgrimatorremolinos.com)

# Solo manual. Sube la web a la raíz del alojamiento OVH (carpeta padre de
# la de staging). No borra nada del servidor: los archivos de WordPress se
# quedan como respaldo; .htaccess (DirectoryIndex index.html) hace que se
# sirva la web nueva.
on:
  workflow_dispatch:
  # Cambios guardados desde el panel (/admin): se publican solos. Solo los
  # commits del panel (mensaje "Panel: …"); el resto sigue siendo manual.
  push:
    branches: [claude/esgrima-web-rebuild-1or7ev]
    paths:
      - "src/content/data/**"
      - "public/images/**"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Panel:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Por si el panel sube una foto sin optimizar: lo publicado sale siempre
      # en WebP reducido (el repositorio lo corrige aparte, optimize-images.yml).
      - name: Optimizar fotos
        run: SHARP_DIR="$GITHUB_WORKSPACE" node .github/scripts/optimize-images.mjs
      # Calendario desde SportMember (solo datos públicos). Sin credenciales
      # no hace nada y la web muestra "muy pronto".
      - name: Calendario de SportMember
        env:
          SPORTMEMBER_USER: ${{ secrets.SPORTMEMBER_USER }}
          SPORTMEMBER_PASSWORD: ${{ secrets.SPORTMEMBER_PASSWORD }}
          SPORTMEMBER_TEAMS: ${{ vars.SPORTMEMBER_TEAMS }}
        run: node .github/scripts/sportmember-sync.mjs

      - name: Build (raíz del dominio)
        run: npm run build
        env:
          BASE_PATH: ""
      - name: Configuración de Instagram
        run: |
          cat > out/instagram-config.php <<PHP
          <?php
          define("INSTAGRAM_USER_ID", "${{ secrets.INSTAGRAM_USER_ID }}");
          define("INSTAGRAM_ACCESS_TOKEN", "${{ secrets.INSTAGRAM_ACCESS_TOKEN }}");
          PHP
      # Credenciales del inicio de sesión del panel (/admin). Igual que con
      # Instagram, solo existen en el runner y en el servidor, nunca en git.
      - name: Configuración del panel
        run: |
          cat > out/admin-auth/config.php <<PHP
          <?php
          define("GITHUB_CLIENT_ID", "${{ secrets.GITHUB_OAUTH_CLIENT_ID }}");
          define("GITHUB_CLIENT_SECRET", "${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}");
          PHP

      # Datos que leen los PHP del servidor (tienda y área de gestión).
      - name: Datos para tienda y gestión
        run: |
          cp src/content/data/tienda.json out/tienda-productos.json
          cp src/content/data/reservas.json out/reservas-config.json
          cp src/content/data/mercadillo.json out/mercadillo-config.json
          node -e 'const d=require("./src/content/data/calendario.generated.json"); require("fs").writeFileSync("out/calendario.json", JSON.stringify(d.items||[]))'

      # Clave de los recordatorios de la clase gratis: sha256("recordatorios:" +
      # FTP_PASSWORD). La calcula igual recordatorios.yml; solo vive en el runner
      # y en el servidor, nunca se imprime ni va a git.
      - name: Configuración de recordatorios
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "Recordatorios sin configurar (falta FTP_PASSWORD)"; rm -f out/recordatorios-config.php; exit 0
          fi
          KEY=$(printf '%s' "recordatorios:$FTP_PASSWORD" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          printf '<?php\ndefine("RECORDATORIOS_KEY", "%s");\n' "$KEY" > out/recordatorios-config.php
          php -l out/recordatorios-config.php >/dev/null && echo "recordatorios-config.php generado"

      # Área de gestión (/gestion/): usuario y contraseña desde secrets; la
      # contraseña se guarda solo como hash. Sin secrets, queda "no configurada".
      - name: Configuración de gestión
        env:
          GESTION_USER: ${{ secrets.GESTION_USER }}
          GESTION_PASSWORD: ${{ secrets.GESTION_PASSWORD }}
        run: |
          if [ -z "$GESTION_USER" ] || [ -z "$GESTION_PASSWORD" ]; then
            echo "Gestión sin configurar (faltan secrets)"; rm -f out/gestion/config.php; exit 0
          fi
          php -r '
            $u = getenv("GESTION_USER");
            $h = password_hash(getenv("GESTION_PASSWORD"), PASSWORD_DEFAULT);
            file_put_contents("out/gestion/config.php", "<?php\ndefine(\"GESTION_USER\", " . var_export($u, true) . ");\ndefine(\"GESTION_PASS_HASH\", " . var_export($h, true) . ");\n");
          '
          php -l out/gestion/config.php

      - name: Carpeta raíz
        id: dest
        env:
          DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: echo "remote=${DIR%/nuevo}" >> "$GITHUB_OUTPUT"
      # lftp reintenta si OVH corta la conexión e incluye archivos ocultos
      # (.htaccess). Primero todo menos la portada y el .htaccess; esos dos
      # al final, para que el cambio desde WordPress sea instantáneo.
      - name: Subir por SFTP (lftp)
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          REMOTE: ${{ steps.dest.outputs.remote }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p ~/.ssh && ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SET="set net:max-retries 8; set net:reconnect-interval-base 5; set net:timeout 30; set sftp:auto-confirm yes; set mirror:parallel-transfer-count 2"
          lftp -u "$USER" --env-password -e "$SET; mirror -R --verbose=1 --exclude '^index\.html$' --exclude '^\.htaccess$' out $REMOTE; bye" "sftp://$HOST"
          lftp -u "$USER" --env-password -e "$SET; cd $REMOTE; put out/.htaccess -o .htaccess; put out/index.html -o index.html; bye" "sftp://$HOST"

      - name: Comprobar en vivo
        run: |
          sleep 5
          for p in / /horarios-y-precios/ /index.php/esgrima-ninos/ /sitemap.xml; do
            printf "%s -> " "$p"; curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" -A "Mozilla/5.0" "https://www.esgrimatorremolinos.com$p"
          done
          curl -sSL -A "Mozilla/5.0" https://www.esgrimatorremolinos.com/ -o home.html
          grep -q "En guardia" home.html && echo "HTML NUEVO OK" || echo "HTML NUEVO NO DETECTADO"
          CSS=$(grep -o 'href="/_next/[^"]*\.css"' home.html | head -1 | sed 's/href="//;s/"$//')
          printf "CSS %s -> " "$CSS"; curl -sS -o /dev/null -w "%{http_code}\n" "https://www.esgrimatorremolinos.com$CSS"
