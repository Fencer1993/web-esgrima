name: Probar API de SportMember (cuenta demo)

# Prueba temporal con la cuenta pública "demo" de la documentación oficial
# (https://github.com/Holdsport/holdsport-api). No usa datos del club.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Equipos, actividades y miembros (demo)
        run: |
          A='-sS -u demo:demo -H Accept:application/json'
          echo "== /v1/teams"; curl $A https://api.holdsport.dk/v1/teams | head -c 1500; echo
          T=$(curl $A https://api.holdsport.dk/v1/teams | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
          echo "== equipo $T"
          echo "== actividades"; curl $A "https://api.holdsport.dk/v1/teams/$T/activities?per_page=3" | head -c 2500; echo
          echo "== miembros (solo nombres de campos)"; curl $A "https://api.holdsport.dk/v1/teams/$T/members" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d),'miembros'); print(sorted(d[0].keys()) if d else d)"
          echo "== perfil (campos)"; curl $A https://api.holdsport.dk/v1/user | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d.keys()))"
